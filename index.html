<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>废土小黑屋 · 深度扩充版</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: #0a0c12;
            font-family: 'Courier New', monospace;
            padding: 20px;
            color: #e9e2c7;
        }
        .game-container {
            max-width: 1600px;
            margin: 0 auto;
            background: #1e1b15e0;
            backdrop-filter: blur(3px);
            border-radius: 2rem;
            border: 1px solid #b87a3b;
            padding: 1.5rem;
            box-shadow: 0 10px 30px black;
        }
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }
        .map-panel {
            flex: 2;
            min-width: 360px;
            background: #0c0e0a;
            border-radius: 1.5rem;
            padding: 1rem;
            border: 1px solid #6a4e2a;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #1e2a1a;
            border-radius: 1rem;
            cursor: pointer;
            width: 100%;
            height: auto;
        }
        .info-panel {
            flex: 3;
            min-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .stats-grid {
            background: #15100a;
            border-radius: 1rem;
            padding: 0.8rem;
            border-left: 6px solid #e09d42;
        }
        .resource-grid, .faction-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px,1fr));
            gap: 6px;
            background: #1e1912;
            border-radius: 1rem;
            padding: 0.8rem;
        }
        .res-item, .faction-item {
            font-size: 0.75rem;
            background: #2c241a;
            padding: 4px 8px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
        }
        .weapon-panel, .combat-zone, .faction-panel, .tech-panel, .settler-panel {
            background: #100e0a;
            border-radius: 1rem;
            padding: 0.6rem;
        }
        .weapon-list, .skill-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 5px;
        }
        button {
            background: #4f351d;
            border: none;
            font-family: monospace;
            font-weight: bold;
            color: #ffecb3;
            padding: 4px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        button:hover { background: #7e5a34; transform: scale(0.96); }
        .log-box {
            background: #050302aa;
            border-radius: 1rem;
            height: 160px;
            overflow-y: auto;
            padding: 6px;
            font-size: 0.7rem;
        }
        .log-entry { border-bottom: 1px solid #6a4a2a33; padding: 3px 0; color: #dbc28b; }
        .good { color: #a5d6a5; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .hp-bar { background: #4a2a1a; height: 8px; border-radius: 10px; overflow: hidden; margin: 4px 0; }
        .hp-fill { background: #d95b2a; width: 100%; height: 100%; }
        .status-icon { font-size: 0.7rem; margin-left: 4px; }
    </style>
</head>
<body>
<div class="game-container">
    <div class="dashboard">
        <div class="map-panel">
            <canvas id="mapCanvas" width="600" height="600"></canvas>
            <div class="flex-between" style="font-size:10px; margin-top:6px;">
                <span>@玩家 | 字母怪物 | 符号建筑</span>
                <span id="seasonDisplay">季节: 旱季</span>
            </div>
        </div>

        <div class="info-panel">
            <div class="stats-grid">
                <div class="flex-between"><span>生命</span><span id="hpText">35/35</span></div>
                <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div>
                <div class="flex-between"><span>攻击</span><span id="totalAtk">8</span> | 防御 <span id="defVal">2</span> | 负重 <span id="curWeight">0</span>/<span id="maxWeight">60</span></div>
                <div class="flex-between"><span>科技点</span><span id="techPoints">0</span> | 季节 <span id="seasonName">旱季</span> | 天数 <span id="dayCount">0</span></div>
                <div class="flex-between"><span>游民</span><span id="settlerCount">0</span> | 设施 <span id="facilityCount">0</span> | 坐标 [<span id="coordX">0</span>,<span id="coordY">0</span>]</div>
            </div>

            <div><strong>资源 (重量)</strong></div>
            <div class="resource-grid" id="resourcePanel"></div>

            <div class="weapon-panel">
                <div class="flex-between"><strong>武器库</strong><button id="craftWeaponBtn">制作武器</button></div>
                <div id="weaponList" class="weapon-list"></div>
            </div>

            <div class="combat-zone">
                <div>战斗状态</div>
                <div id="combatInfo">未进入战斗</div>
                <div id="skillPanel" class="skill-list"></div>
                <div style="margin-top:4px;">
                    <button id="attackBtn" disabled>普通攻击</button>
                    <button id="fleeBtn" disabled>逃跑</button>
                </div>
                <div id="statusEffectPanel" style="font-size:10px; margin-top:4px;"></div>
            </div>

            <div class="settler-panel">
                <div class="flex-between"><strong>游民管理</strong><button id="recruitBtn">招募 (20食15水)</button></div>
                <div id="settlerList" style="font-size:11px; max-height:80px; overflow-y:auto;"></div>
                <button id="assignTaskBtn" style="margin-top:4px;">派遣任务(采集/巡逻)</button>
            </div>

            <div class="faction-panel">
                <div class="flex-between"><strong>派系声望</strong><button id="factionMissionBtn">派系任务</button></div>
                <div id="factionList" class="faction-grid"></div>
            </div>

            <div class="tech-panel">
                <div class="flex-between"><strong>科技树</strong><span id="techPointsDisplay">0点</span></div>
                <div id="techTree" style="font-size:11px; max-height:100px; overflow-y:auto;"></div>
            </div>

            <div class="log-box" id="logPanel"></div>
            <button id="resetBtn" style="background:#631e1e;">重启废土</button>
        </div>
    </div>
</div>

<script>
    // ======================== 扩充系统 ========================
    // 1. 负重系统: 每种资源定义重量
    const RESOURCE_WEIGHT = {
        "食物":0.2, "水":0.3, "废金属":0.5, "木头":0.4, "布料":0.2,
        "电子元件":0.2, "化学品":0.2, "燃油":0.4, "药品":0.1, "弹药":0.1,
        "混凝土":0.8, "玻璃":0.3
    };
    let baseWeightCapacity = 60; // 初始负重上限，可通过设施提升

    // 2. 战斗系统: 技能、状态效果
    let playerSkills = { // 技能冷却/可用
        heavyStrike: { name:"重击", costAP:1, damageBonus:5, cooldown:0, maxCooldown:2 },
        defend: { name:"防御姿态", costAP:1, effect:"defend", duration:2, cooldown:0, maxCooldown:3 }
    };
    let actionPoints = 2; // 每回合2点
    let playerStatus = {}; // { bleeding:回合数, poison:回合数, defend:回合数 }
    let monsterStatus = {};

    // 3. 游民深度: 职业、忠诚度、任务
    let settlersList = []; // { name,职业, loyalty, hp, atk, def, taskRemaining }
    const PROFESSIONS = {
        gatherer: { name:"采集者", atkBonus:0, defBonus:0, harvest:1 },
        guard: { name:"守卫", atkBonus:2, defBonus:2, harvest:0 },
        scout: { name:"侦察兵", atkBonus:1, defBonus:1, scoutRange:1 }
    };

    // 4. 派系系统
    let factions = {
        brotherhood: { name:"钢铁兄弟会", reputation:0, relation:0, missions:[] },
        raiders: { name:"掠夺者帮", reputation:0, relation:0, missions:[] },
        mutants: { name:"变异联盟", reputation:0, relation:0, missions:[] }
    };
    let factionGrids = []; // 地图上派系据点 {x,y,factionId}

    // 5. 科技树
    let techTree = {
        "基础锻造": { cost:10, unlocked:false, effect:"解锁中级武器" },
        "中级武器": { cost:20, unlocked:false, effect:"可制作能量刃、动力锤" },
        "自动化": { cost:30, unlocked:false, effect:"设施产量+20%" },
        "医疗科技": { cost:15, unlocked:false, effect:"医疗站效果翻倍" }
    };
    let techPoints = 0;

    // 6. 季节/天气
    let seasons = ["旱季","雨季","辐射尘暴季"];
    let currentSeason = 0; // 0旱季 1雨季 2尘暴季
    let dayCounter = 0;
    let seasonDays = 0;

    // ----- 原有全局变量 -----
    const MAP_SIZE = 30;
    const CANVAS_SIZE = 600;
    const CELL_SIZE = CANVAS_SIZE / MAP_SIZE;
    const RESOURCES = Object.keys(RESOURCE_WEIGHT);
    const MONSTER_DB = [ /* 同上略，保留原有11种 */ 
        { name: "变种蟑螂", code: "C", hp: 12, atk: 4, def: 1, drops: { "食物": [1,3], "化学品": [1,2] } },
        { name: "辐射僵尸", code: "Z", hp: 18, atk: 6, def: 2, drops: { "布料": [1,3], "药品": [0,1] } },
        { name: "废土掠夺者", code: "R", hp: 20, atk: 8, def: 3, drops: { "弹药": [1,4], "废金属": [2,5] } },
        { name: "变异巨鼠", code: "M", hp: 10, atk: 5, def: 0, drops: { "食物": [1,2], "布料": [1,2] } },
        { name: "焦油怪", code: "T", hp: 25, atk: 7, def: 4, drops: { "燃油": [2,5], "化学品": [1,3] } },
        { name: "电子幽灵", code: "E", hp: 15, atk: 9, def: 1, drops: { "电子元件": [2,5], "玻璃": [1,2] } },
        { name: "铁甲蝎", code: "S", hp: 28, atk: 10, def: 5, drops: { "废金属": [3,7], "化学品": [1,2] } },
        { name: "变异树人", code: "W", hp: 32, atk: 6, def: 6, drops: { "木头": [4,8], "药品": [1,2] } },
        { name: "疯狂科学家", code: "D", hp: 22, atk: 12, def: 2, drops: { "电子元件": [2,4], "化学品": [2,4], "药品": [1,3] } },
        { name: "巨化蠕虫", code: "G", hp: 40, atk: 11, def: 3, drops: { "混凝土": [2,5], "食物": [2,5] } },
        { name: "辐射幽灵", code: "F", hp: 18, atk: 9, def: 2, drops: { "药品": [1,3], "玻璃": [1,2] } }
    ];
    const WEAPONS = [
        { id: "rusted_sword", name: "生锈砍刀", atkBonus: 3, cost: { "废金属": 8, "木头": 5 }, techReq: null },
        { id: "pipe_rifle", name: "土制步枪", atkBonus: 5, cost: { "废金属": 15, "电子元件": 3, "弹药": 5 }, techReq: null },
        { id: "energy_blade", name: "能量刃", atkBonus: 8, cost: { "电子元件": 12, "化学品": 8, "玻璃": 5 }, techReq: "中级武器" },
        { id: "heavy_hammer", name: "动力锤", atkBonus: 10, cost: { "废金属": 25, "混凝土": 6, "燃油": 4 }, techReq: "中级武器" }
    ];
    const FACILITIES = [ /* 保留部分核心设施，增加科技相关 */ 
        { id: "tent", name: "帐篷", cost: { "木头": 10, "布料": 5 }, effect: "maxHp+5, 负重+10", built: false },
        { id: "farm", name: "农田", cost: { "木头": 15, "水": 8, "食物": 5 }, effect: "每8h产食物+5", built: false },
        { id: "well", name: "水井", cost: { "木头": 12, "废金属": 8 }, effect: "每8h产水+4", built: false },
        { id: "workshop", name: "工坊", cost: { "废金属": 20, "木头": 10 }, effect: "可制作武器", built: false },
        { id: "infirmary", name: "医疗站", cost: { "药品": 5, "废金属": 15, "布料": 10 }, effect: "每8h回复2hp", built: false },
        { id: "lab", name: "实验室", cost: { "电子元件": 15, "化学品": 10, "玻璃": 8 }, effect: "每8h产生科技点+2", built: false },
        { id: "radio", name: "广播塔", cost: { "电子元件": 20, "废金属": 25 }, effect: "吸引游民", built: false }
    ];
    const BUILDINGS = [ /* 保留建筑，略 */ 
        { name: "废弃小屋", symbol: "H", combatWaves: 0, reward: (p) => { p.addResource("食物",6); p.addResource("废金属",4); p.addLog("小屋中找到物资。",true); } },
        { name: "变异巢穴", symbol: "N", combatWaves: 2, reward: (p) => { p.addResource("化学品",6); p.addResource("药品",3); p.addLog("巢穴战利品。",true); } }
    ];

    // 全局变量
    let gameOver = false;
    let inCombat = false;
    let currentMonster = null;
    let monsterGrid = Array(MAP_SIZE).fill().map(()=>Array(MAP_SIZE).fill(null));
    let buildingGrid = Array(MAP_SIZE).fill().map(()=>Array(MAP_SIZE).fill(null));
    let player = { x:0, y:0, hp:35, maxHp:35, baseAtk:8, def:2 };
    let resources = {};
    let builtFacilities = [];
    let ownedWeapons = [];
    let equippedWeaponId = null;
    let logEntries = [];
    let activeBuildingCombat = null;
    let buildingCombatActive = false;

    // 辅助函数
    function addLog(msg, isGood=false) {
        logEntries.unshift(`[D${dayCounter}] ${msg}`);
        if(logEntries.length>50) logEntries.pop();
        document.getElementById("logPanel").innerHTML = logEntries.map(m=>`<div class="log-entry ${isGood?'good':''}">${m}</div>`).join('');
    }
    function addResource(res, amount) {
        if(!resources[res]) resources[res]=0;
        resources[res] += amount;
        if(resources[res]<0) resources[res]=0;
    }
    function getTotalAttack() { 
        let bonus = ownedWeapons.includes(equippedWeaponId) ? WEAPONS.find(w=>w.id===equippedWeaponId)?.atkBonus||0 : 0;
        return player.baseAtk + bonus;
    }
    function getCurrentWeight() {
        let w = 0;
        for(let r of RESOURCES) w += (resources[r]||0) * (RESOURCE_WEIGHT[r]||0);
        return Math.floor(w*10)/10;
    }
    function getMaxWeight() { return baseWeightCapacity + (builtFacilities.includes("tent")?10:0); }
    function checkWeightLimit() { return getCurrentWeight() <= getMaxWeight(); }

    // 季节推进
    function advanceSeason() {
        seasonDays++;
        if(seasonDays >= 8) {
            seasonDays = 0;
            currentSeason = (currentSeason+1)%3;
            let seasonName = seasons[currentSeason];
            addLog(`季节更替: ${seasonName}`, true);
            if(currentSeason===2) addLog("辐射尘暴季: 移动消耗增加,怪物变强", false);
        }
        document.getElementById("seasonName").innerText = seasons[currentSeason];
        document.getElementById("dayCount").innerText = dayCounter;
    }

    // 科技解锁检查
    function isTechUnlocked(techId) { return techTree[techId]?.unlocked || false; }
    function unlockTech(techId) {
        if(techTree[techId] && !techTree[techId].unlocked && techPoints >= techTree[techId].cost) {
            techPoints -= techTree[techId].cost;
            techTree[techId].unlocked = true;
            addLog(`科技解锁: ${techId}`, true);
            return true;
        }
        return false;
    }

    // 派系交互简化
    function getFactionRep(fid) { return factions[fid].reputation; }
    function changeRep(fid, delta) { factions[fid].reputation += delta; addLog(`${factions[fid].name} 声望 ${delta>0?`+${delta}`:delta}`, true); }

    // 游民任务系统
    function assignSettlerTask(settler, taskType) {
        if(taskType === "gather") {
            addLog(`${settler.name} 外出采集,获得资源`, true);
            addResource("食物", 3+settler.loyalty/10);
        } else if(taskType === "patrol") {
            addLog(`${settler.name} 巡逻提升防御`, true);
            player.def += 1;
        }
    }

    // 战斗技能
    function useSkill(skillId) {
        if(!inCombat || !currentMonster) return;
        let skill = playerSkills[skillId];
        if(skill.cooldown>0) { addLog(`${skill.name} 冷却中`, false); return; }
        if(actionPoints < skill.costAP) { addLog("行动点不足", false); return; }
        actionPoints -= skill.costAP;
        if(skillId === "heavyStrike") {
            let dmg = getTotalAttack() + skill.damageBonus - currentMonster.def + Math.floor(Math.random()*4);
            dmg = Math.max(2,dmg);
            currentMonster.hp -= dmg;
            addLog(`重击造成 ${dmg} 伤害!`, true);
            skill.cooldown = skill.maxCooldown;
        } else if(skillId === "defend") {
            playerStatus.defend = skill.duration;
            addLog("进入防御姿态,下回合受伤减半", true);
            skill.cooldown = skill.maxCooldown;
        }
        if(currentMonster.hp<=0) resolveCombatWin();
        else monsterTurn();
        refreshUI();
    }

    function monsterTurn() {
        let dmg = Math.max(1, currentMonster.atk - player.def);
        if(playerStatus.defend>0) { dmg = Math.floor(dmg/2); playerStatus.defend--; }
        player.hp -= dmg;
        addLog(`${currentMonster.name} 攻击造成 ${dmg} 伤害`, false);
        if(player.hp<=0) { gameOver=true; inCombat=false; addLog("游戏结束",false); }
        refreshUI();
    }

    function resolveCombatWin() {
        let drops = currentMonster.drops;
        for(let [res, range] of Object.entries(drops)){
            let amt = range[0] + Math.floor(Math.random()*(range[1]-range[0]+1));
            addResource(res, amt);
            addLog(`获得 ${res} x${amt}`, true);
        }
        addLog(`击败 ${currentMonster.name}`, true);
        if(buildingCombatActive){
            activeBuildingCombat.currentWave++;
            if(activeBuildingCombat.currentWave <= activeBuildingCombat.totalWaves) spawnNextWave();
            else { finishBuildingCombat(); }
        } else {
            monsterGrid[player.x][player.y] = null;
            inCombat = false;
            currentMonster = null;
        }
        refreshUI();
    }

    function spawnNextWave() { /* 类似之前 */ }
    function finishBuildingCombat() { buildingCombatActive=false; activeBuildingCombat=null; inCombat=false; currentMonster=null; addLog("连续战斗完成",true); }

    // UI刷新整合
    function refreshUI() {
        document.getElementById("hpText").innerText = `${player.hp}/${player.maxHp}`;
        document.getElementById("hpFill").style.width = `${(player.hp/player.maxHp)*100}%`;
        document.getElementById("totalAtk").innerText = getTotalAttack();
        document.getElementById("defVal").innerText = player.def;
        let curW = getCurrentWeight(), maxW = getMaxWeight();
        document.getElementById("curWeight").innerText = curW;
        document.getElementById("maxWeight").innerText = maxW;
        if(curW > maxW) document.getElementById("curWeight").style.color = "#ff8866";
        else document.getElementById("curWeight").style.color = "#e9e2c7";
        document.getElementById("techPoints").innerText = techPoints;
        document.getElementById("settlerCount").innerText = settlersList.length;
        document.getElementById("facilityCount").innerText = builtFacilities.length;
        document.getElementById("coordX").innerText = player.x;
        document.getElementById("coordY").innerText = player.y;

        // 资源面板带重量
        const resPanel = document.getElementById("resourcePanel");
        resPanel.innerHTML = "";
        for(let r of RESOURCES) {
            let val = resources[r]||0;
            let weight = (val * RESOURCE_WEIGHT[r]).toFixed(1);
            resPanel.innerHTML += `<div class="res-item"><span>${r}</span><span>${Math.floor(val)} (${weight})</span></div>`;
        }

        // 武器列表
        const weaponDiv = document.getElementById("weaponList");
        weaponDiv.innerHTML = "";
        for(let w of WEAPONS) {
            if(ownedWeapons.includes(w.id)) {
                let btn = document.createElement("button");
                btn.innerText = equippedWeaponId===w.id ? "已装备" : "装备";
                btn.onclick = ()=> { equippedWeaponId = w.id; refreshUI(); addLog(`装备 ${w.name}`,true); };
                weaponDiv.appendChild(document.createTextNode(`${w.name}+${w.atkBonus} `));
                weaponDiv.appendChild(btn);
            }
        }

        // 技能面板
        const skillDiv = document.getElementById("skillPanel");
        skillDiv.innerHTML = "";
        if(inCombat && !gameOver) {
            for(let [id,sk] of Object.entries(playerSkills)) {
                let btn = document.createElement("button");
                btn.innerText = `${sk.name} (AP${sk.costAP})${sk.cooldown>0?` [${sk.cooldown}]`:""}`;
                btn.disabled = sk.cooldown>0 || actionPoints<sk.costAP;
                btn.onclick = ()=>useSkill(id);
                skillDiv.appendChild(btn);
            }
            document.getElementById("attackBtn").disabled = false;
            document.getElementById("fleeBtn").disabled = false;
        } else {
            document.getElementById("attackBtn").disabled = true;
            document.getElementById("fleeBtn").disabled = true;
        }

        // 游民列表
        const settlerDiv = document.getElementById("settlerList");
        settlerDiv.innerHTML = settlersList.map(s=>`${s.name}(${PROFESSIONS[s.prof].name}) 忠诚${s.loyalty}`).join("<br>")||"无";

        // 派系声望
        const factionDiv = document.getElementById("factionList");
        factionDiv.innerHTML = "";
        for(let f in factions) {
            factionDiv.innerHTML += `<div class="faction-item"><span>${factions[f].name}</span><span>${factions[f].reputation}</span></div>`;
        }

        // 科技树
        const techDiv = document.getElementById("techTree");
        techDiv.innerHTML = "";
        for(let t in techTree) {
            let state = techTree[t].unlocked ? "已解锁" : `需${techTree[t].cost}科技点`;
            let btn = document.createElement("button");
            btn.innerText = state==="已解锁"?"已解锁":"研究";
            btn.disabled = techTree[t].unlocked || techPoints < techTree[t].cost;
            if(!techTree[t].unlocked && techPoints >= techTree[t].cost) btn.onclick = ()=> { if(unlockTech(t)) refreshUI(); };
            techDiv.innerHTML += `<div>${t} (${state}) ${btn.outerHTML}</div>`;
        }

        // 战斗状态显示
        let statusText = "";
        if(playerStatus.bleeding) statusText += "流血 ";
        if(playerStatus.poison) statusText += "中毒 ";
        if(playerStatus.defend) statusText += "防御 ";
        document.getElementById("statusEffectPanel").innerHTML = statusText;
    }

    // 移动等逻辑整合
    function tryMove(dx,dy){
        if(gameOver || inCombat) return;
        let nx=player.x+dx, ny=player.y+dy;
        if(nx<0||nx>=MAP_SIZE||ny<0||ny>=MAP_SIZE) return;
        // 负重超限无法移动?
        if(getCurrentWeight() > getMaxWeight()) { addLog("负重超载,无法移动!",false); return; }
        advanceTime(1);
        player.x=nx; player.y=ny;
        // 季节影响: 尘暴季移动额外消耗1小时
        if(currentSeason===2) advanceTime(1);
        // 遭遇逻辑
        let bld = buildingGrid[nx][ny];
        if(bld && bld.combatWaves>0) { startBuildingCombat(bld); return; }
        let mon = monsterGrid[nx][ny];
        if(mon) { startCombat(mon); return; }
        if(bld) { bld.reward(this); buildingGrid[nx][ny]=null; addLog(`探索${bld.name}`,true); }
        refreshUI(); drawMap();
    }
    function startCombat(mon) { inCombat=true; currentMonster={...mon}; actionPoints=2; playerStatus={}; monsterStatus={}; addLog(`遭遇 ${mon.name}`,false); refreshUI(); }
    function startBuildingCombat(bld) { activeBuildingCombat={building:bld,currentWave:1,totalWaves:bld.combatWaves,rewardsCallback:bld.reward}; buildingCombatActive=true; spawnNextWaveMonster(); refreshUI(); }
    function spawnNextWaveMonster() { /* 简化 */ let idx=Math.floor(Math.random()*MONSTER_DB.length); let m={...MONSTER_DB[idx]}; currentMonster=m; inCombat=true; addLog(`战斗第${activeBuildingCombat.currentWave}波:${m.name}`,false); }

    function advanceTime(hours){
        if(gameOver) return;
        dayCounter += hours/24;
        advanceSeason();
        // 设施产出每8h触发
        let prodTrigger = Math.floor(dayCounter*3) - Math.floor((dayCounter-hours/24)*3);
        if(prodTrigger>0){
            for(let id of builtFacilities){
                if(id==="farm") addResource("食物",5);
                if(id==="well") addResource("水",4);
                if(id==="lab") { techPoints+=2; addLog("实验室产出科技点+2",true); }
                if(id==="infirmary") player.hp = Math.min(player.maxHp, player.hp+2);
            }
            if(settlersList.length>0) addResource("食物", settlersList.length);
        }
        if(Math.random()<0.2) triggerRandomEvent();
        refreshUI();
    }
    function triggerRandomEvent(){
        let events = [
            ()=> { addResource("食物",-3); addLog("沙尘暴损失食物",false); },
            ()=> { techPoints+=1; addLog("发现旧科技+1点",true); },
            ()=> { if(settlersList.length>0) { let s=settlersList[0]; s.loyalty-=5; addLog(`${s.name}忠诚下降`,false); } }
        ];
        events[Math.floor(Math.random()*events.length)]();
    }
    function recruitSettler(){
        if(resources["食物"]>=20 && resources["水"]>=15 && getCurrentWeight()+5 <= getMaxWeight()){
            resources["食物"]-=20; resources["水"]-=15;
            let prof = Object.keys(PROFESSIONS)[Math.floor(Math.random()*3)];
            settlersList.push({ name:`游民${settlersList.length+1}`, prof:prof, loyalty:70, hp:20, atk:5, def:2 });
            addLog("新游民加入",true);
            refreshUI();
        } else addLog("资源不足或负重不够",false);
    }
    function craftWeapon(){
        let available = WEAPONS.filter(w=>!ownedWeapons.includes(w.id) && (!w.techReq || isTechUnlocked(w.techReq)));
        if(available.length===0){ addLog("无可用武器",false); return; }
        let w = available[0];
        for(let [mat,cost] of Object.entries(w.cost)) if((resources[mat]||0)<cost){ addLog(`缺${mat}`,false); return; }
        for(let [mat,cost] of Object.entries(w.cost)) resources[mat]-=cost;
        ownedWeapons.push(w.id);
        addLog(`制作${w.name}`,true);
        refreshUI();
    }
    function resetGame(){
        gameOver=false; inCombat=false; buildingCombatActive=false;
        player={x:0,y:0,hp:35,maxHp:35,baseAtk:8,def:2};
        resources={}; RESOURCES.forEach(r=>resources[r]= (r==="食物"?25:r==="水"?20:5));
        resources["废金属"]=15; resources["木头"]=12; resources["布料"]=8;
        settlersList=[]; builtFacilities=[]; ownedWeapons=[]; equippedWeaponId=null;
        techPoints=0; dayCounter=0; currentSeason=0; seasonDays=0;
        for(let t in techTree) techTree[t].unlocked=false;
        factions.brotherhood.reputation=0; factions.raiders.reputation=0; factions.mutants.reputation=0;
        initWorld();
        addLog("游戏重置,深度扩充版启动",true);
        refreshUI(); drawMap();
    }
    function initWorld(){
        for(let i=0;i<MAP_SIZE;i++) for(let j=0;j<MAP_SIZE;j++) { monsterGrid[i][j]=null; buildingGrid[i][j]=null; }
        for(let i=0;i<MAP_SIZE;i++) for(let j=0;j<MAP_SIZE;j++){
            if(i===0&&j===0) continue;
            if(Math.random()<0.3){
                let idx=Math.floor(Math.random()*MONSTER_DB.length);
                monsterGrid[i][j]={...MONSTER_DB[idx], hp:MONSTER_DB[idx].hp+Math.floor(Math.random()*6)-2};
            } else if(Math.random()<0.15){
                let b=BUILDINGS[Math.floor(Math.random()*BUILDINGS.length)];
                buildingGrid[i][j]={...b};
            }
        }
    }
    function drawMap(){
        const canvas=document.getElementById("mapCanvas");
        const ctx=canvas.getContext("2d");
        canvas.width=CANVAS_SIZE; canvas.height=CANVAS_SIZE;
        ctx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
        for(let i=0;i<MAP_SIZE;i++) for(let j=0;j<MAP_SIZE;j++){
            let x=j*CELL_SIZE, y=i*CELL_SIZE;
            ctx.fillStyle=(i===player.x && j===player.y)?"#3a542a":"#1f3820";
            ctx.fillRect(x,y,CELL_SIZE-1,CELL_SIZE-1);
            ctx.strokeStyle="#5c7840"; ctx.strokeRect(x,y,CELL_SIZE-1,CELL_SIZE-1);
            ctx.font=`${CELL_SIZE*0.5}px monospace`; ctx.fillStyle="#f3e0b0";
            if(i===player.x && j===player.y) ctx.fillText("@", x+CELL_SIZE*0.3, y+CELL_SIZE*0.7);
            else if(monsterGrid[i][j]) ctx.fillText(monsterGrid[i][j].code, x+CELL_SIZE*0.3, y+CELL_SIZE*0.7);
            else if(buildingGrid[i][j]) ctx.fillText(buildingGrid[i][j].symbol, x+CELL_SIZE*0.3, y+CELL_SIZE*0.7);
            else ctx.fillText(".", x+CELL_SIZE*0.4, y+CELL_SIZE*0.7);
        }
    }
    function bindEvents(){
        const canvas=document.getElementById("mapCanvas");
        canvas.addEventListener("click",(e)=>{
            const rect=canvas.getBoundingClientRect();
            const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
            const mx=(e.clientX-rect.left)*scaleX, my=(e.clientY-rect.top)*scaleY;
            const col=Math.floor(mx/CELL_SIZE), row=Math.floor(my/CELL_SIZE);
            if(row>=0 && row<MAP_SIZE && col>=0 && col<MAP_SIZE){
                let dx=row-player.x, dy=col-player.y;
                if(Math.abs(dx)+Math.abs(dy)===1) tryMove(dx,dy);
                else addLog("只能移动相邻",false);
            }
        });
        document.getElementById("attackBtn").onclick = ()=>{ if(inCombat && currentMonster){ let dmg=Math.max(1,getTotalAttack()-currentMonster.def+Math.floor(Math.random()*4)); currentMonster.hp-=dmg; addLog(`攻击造成${dmg}伤害`,true); if(currentMonster.hp<=0) resolveCombatWin(); else monsterTurn(); refreshUI(); } };
        document.getElementById("fleeBtn").onclick = ()=>{ if(inCombat){ addLog("逃跑成功",false); inCombat=false; currentMonster=null; refreshUI(); } };
        document.getElementById("recruitBtn").onclick = recruitSettler;
        document.getElementById("craftWeaponBtn").onclick = craftWeapon;
        document.getElementById("assignTaskBtn").onclick = ()=>{ if(settlersList.length) assignSettlerTask(settlersList[0],"gather"); else addLog("无游民",false); };
        document.getElementById("resetBtn").onclick = resetGame;
    }
    resetGame();
    bindEvents();
    setInterval(()=>{ if(!gameOver && !inCombat) drawMap(); }, 500);
</script>
</body>
</html>
